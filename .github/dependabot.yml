# Atualizacoes de dependencias automaticas, agrupadas em 1 PR por semana.
# Reduz ruido: agrupa por ecossistema e ignora saltos major (revisar a mao).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      producao:
        dependency-type: production
        update-types: [minor, patch]
      desenvolvimento:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns: ['*']
