# Varredura de segredos no codigo e no historico do git.
# Complementa o secret scanning nativo do GitHub e bloqueia .env/chaves versionados.
name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '30 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Procurar credenciais expostas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout com historico completo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  arquivos-proibidos:
    name: Verificar arquivos que nunca devem ser versionados
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checar arquivos sensiveis
        run: |
          set -euo pipefail
          PROIBIDOS=$(git ls-files | grep -E '(^|/)(\.env(\..*)?$|.*\.pem$|.*\.p12$|.*\.pfx$|id_rsa$|id_ed25519$|.*\.keystore$|.*\.jks$)' | grep -v '\.env\.example' || true)
          if [ -n "$PROIBIDOS" ]; then
            echo "::error::Arquivos sensiveis versionados encontrados:"
            echo "$PROIBIDOS"
            exit 1
          fi
          echo "Nenhum arquivo sensivel versionado."
