# Analise estatica de seguranca do proprio codigo (SAST) com CodeQL.
# Roda quando arquivos de codigo mudam, em PRs e uma varredura semanal.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analise:
    name: Analisar ${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Executar analise
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
